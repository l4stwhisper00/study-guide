<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Учебные заведения | Навигатор</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

  <style>
    :root {
      --bg-base: #050508;
      --bg-surface: #0a0a10;
      --glass-bg: rgba(255, 255, 255, 0.02);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-hover: rgba(255, 255, 255, 0.04);
      --text-main: #ffffff;
      --text-muted: #8b92a5;
      --accent-primary: #00ff88;
      --radius-md: 12px;
      --radius-lg: 16px;
      --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; cursor: default; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a, button, input { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .ambient-bg {
      position: fixed; inset: 0; z-index: -2;
      background: radial-gradient(circle at 50% 0%, #151a2d 0%, var(--bg-base) 60%);
    }

    .nav {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      z-index: 100; width: min(1100px, calc(100% - 40px));
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; border-radius: 100px;
      background: rgba(5, 5, 8, 0.4);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .logo { display: flex; align-items: center; gap: 12px; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 18px; }
    .logo-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: var(--accent-primary); color: var(--bg-base); font-size: 20px; }
    
    .back-btn {
      display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--text-muted);
      transition: var(--transition); padding: 8px 16px; border-radius: 100px; border: 1px solid transparent;
    }
    .back-btn:hover { color: var(--text-main); background: var(--glass-hover); border-color: var(--glass-border); }

    main { flex: 1; padding: 140px 20px 80px; max-width: 1200px; margin: 0 auto; width: 100%; }
    
    .page-header {
      display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; flex-wrap: wrap; gap: 20px;
    }
    .page-title { font-family: 'Manrope', sans-serif; font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; margin-bottom: 16px; }
    .page-sub { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; }

    .stats-row { display: flex; gap: 16px; }
    .stat-item {
      background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 12px 20px;
      border-radius: var(--radius-md); display: flex; align-items: center; gap: 12px;
    }
    .stat-item i { font-size: 24px; color: var(--accent-primary); }
    .stat-info { display: flex; flex-direction: column; }
    .stat-num { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 20px; line-height: 1.2; }
    .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .search-panel {
      display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      padding: 24px; border-radius: var(--radius-lg);
      backdrop-filter: blur(12px);
    }

    .search-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    
    .search-input-wrap { flex: 1; min-width: 250px; position: relative; }
    .search-input-wrap i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 20px; }
    .search-input-wrap input {
      width: 100%; padding: 14px 16px 14px 48px;
      background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
      border-radius: var(--radius-md); color: var(--text-main); font-family: 'Inter', sans-serif; font-size: 15px;
      outline: none; transition: var(--transition); cursor: text; user-select: text;
    }
    .search-input-wrap input:focus { border-color: rgba(0, 255, 136, 0.4); background: rgba(0,0,0,0.5); }

    .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      padding: 14px 24px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
      border-radius: var(--radius-md); color: var(--text-muted); font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 500; transition: var(--transition);
    }
    .filter-btn:hover { background: var(--glass-hover); color: var(--text-main); }
    .filter-btn.active { background: var(--accent-primary); color: var(--bg-base); border-color: var(--accent-primary); }

    .subjects-row {
      display: flex; gap: 8px; flex-wrap: wrap;
      border-top: 1px solid var(--glass-border); padding-top: 20px;
    }
    .subject-btn {
      padding: 8px 16px; border-radius: 100px; background: rgba(0,0,0,0.2);
      border: 1px solid var(--glass-border); color: var(--text-muted);
      font-size: 13px; font-weight: 500; transition: var(--transition);
    }
    .subject-btn:hover { background: var(--glass-hover); color: var(--text-main); }
    .subject-btn.active { 
      background: rgba(0, 255, 136, 0.15); color: var(--accent-primary); 
      border-color: rgba(0, 255, 136, 0.4); font-weight: 600;
    }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
    
    .uni-card {
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg); padding: 28px; transition: var(--transition);
      display: flex; flex-direction: column; position: relative; overflow: hidden;
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .uni-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.15); background: var(--glass-hover); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .uni-type {
      display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; width: fit-content;
    }
    .type-vuz { background: rgba(0, 255, 136, 0.1); color: var(--accent-primary); border: 1px solid rgba(0, 255, 136, 0.2); }
    .type-college { background: rgba(97, 175, 239, 0.1); color: #61afef; border: 1px solid rgba(97, 175, 239, 0.2); }

    .uni-card h3 { font-family: 'Manrope', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .uni-city { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 14px; margin-bottom: 12px; }
    .uni-desc { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
    
    .uni-details { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
    .detail-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
    .detail-row:last-child { margin-bottom: 0; }
    .detail-label { color: var(--text-muted); }
    .detail-val { font-weight: 600; color: var(--text-main); }
    .detail-val.score { color: var(--accent-primary); font-family: 'Manrope', sans-serif; font-size: 16px; }

    @media (max-width: 768px) {
      .search-row { flex-direction: column; align-items: stretch; }
      .filter-group { width: 100%; flex-direction: column; }
      .filter-btn { width: 100%; text-align: center; }
      .cards-grid { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .stats-row { width: 100%; flex-wrap: wrap; }
      .stat-item { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <header class="nav">

  <main>

      <div class="stats-row">

    </div>

    <div class="search-panel">

          <input type="text" placeholder="Поиск по названию или городу..." id="searchInput">

        <div class="filter-group">
          <button class="filter-btn active" onclick="filterCards('all', this)">Все</button>
          <button class="filter-btn" onclick="filterCards('vuz', this)">ВУЗы</button>
          <button class="filter-btn" onclick="filterCards('college', this)">Колледжи</button>

      <div class="subjects-row">

        <button class="subject-btn" onclick="toggleSubject('Рус.', this)">Русский язык</button>
        <button class="subject-btn" onclick="toggleSubject('Физ.', this)">Физика</button>
        <button class="subject-btn" onclick="toggleSubject('Хим.', this)">Химия</button>
        <button class="subject-btn" onclick="toggleSubject('Био.', this)">Биология</button>
        <button class="subject-btn" onclick="toggleSubject('Общ.', this)">Обществознание</button>
        <button class="subject-btn" onclick="toggleSubject('Ист.', this)">История</button>
        <button class="subject-btn" onclick="toggleSubject('Англ.', this)">Английский</button>
      </div>
    </div>

    <div class="cards-grid" id="cardsContainer"></div>
  </main>

    const container = document.getElementById('cardsContainer');
    const searchInput = document.getElementById('searchInput');
    
    let currentFilter = 'all';
    let selectedSubjects = [];

    searchInput.addEventListener('input', updateDisplay);

    function toggleSubject(subject, btn) {
      if (selectedSubjects.includes(subject)) {
        selectedSubjects = selectedSubjects.filter(s => s !== subject);
        btn.classList.remove('active');
      } else {
        selectedSubjects.push(subject);
        btn.classList.add('active');
      }
      updateDisplay();
    }

    function updateDisplay() {
      container.innerHTML = ''; 
      
      database.forEach(item => {
        const matchesType = (currentFilter === 'all' || currentFilter === item.type);
        const searchString = (item.name + " " + item.city).toLowerCase();
        const matchesSearch = searchString.includes(searchInput.value.toLowerCase().trim());
        
        let matchesSubject = true;
        if (selectedSubjects.length > 0) {
          matchesSubject = selectedSubjects.every(sub => item.subjects.includes(sub));
        }

        if (matchesType && matchesSearch && matchesSubject) {
          const card = document.createElement('div');
          card.className = 'uni-card';
          
          const typeLabel = item.type === 'vuz' ? 'ВУЗ' : 'Колледж';
          const typeClass = item.type === 'vuz' ? 'type-vuz' : 'type-college';

          card.innerHTML = `
            <span class="uni-type ${typeClass}">${typeLabel}</span>
            <h3>${item.name}</h3>
            <div class="uni-city"><i class="ph ph-map-pin"></i> ${item.city}</div>
            <p class="uni-desc">${item.desc}</p>
            <div class="uni-details">
              <div class="detail-row"><span class="detail-label">Предметы:</span><span class="detail-val">${item.subjects}</span></div>
              <div class="detail-row"><span class="detail-label">Проходной балл:</span><span class="detail-val score">${item.score}</span></div>
            </div>
          `;
          container.appendChild(card);
        }
      });

      if (container.innerHTML === '') {
        container.innerHTML = `<div style="color: var(--text-muted); text-align: center; grid-column: 1 / -1; padding: 40px; font-size: 16px;">По вашему запросу ничего не найдено. Попробуйте изменить фильтры.</div>`;
      }
    }

    function filterCards(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateDisplay();
    }

    updateDisplay();
