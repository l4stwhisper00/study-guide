name: Biweekly education catalogue source check

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-official-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check official institution websites
        run: node scripts/refresh-catalog-sources.mjs
      - name: Commit freshness report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-source-status.json
          if git diff --cached --quiet; then
            echo "No catalogue freshness changes to commit."
          else
            git commit -m "chore: refresh education catalogue source status"
            git push
          fi
