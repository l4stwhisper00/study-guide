name: Probe public monitoring HTML

on:
  push:
    branches: [feature/national-monitoring-catalog-crawl]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test parser and source marker mapping
        run: node scripts/test-national-monitoring-parser.mjs
      - name: Fetch and inspect official regional pages
        run: node scripts/probe-public-monitoring.mjs
