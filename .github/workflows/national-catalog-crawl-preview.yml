name: Preview national education catalogue crawl

on:
  push:
    branches: [feature/national-monitoring-catalog-crawl]
    paths:
      - "scripts/crawl-national-monitoring.mjs"
      - "scripts/merge-national-monitoring-crawl.mjs"
      - "scripts/national-monitoring-parser.mjs"
      - "scripts/test-national-monitoring-parser.mjs"
      - "scripts/test-national-catalog-import.mjs"
      - "scripts/import-national-catalog.mjs"
      - "scripts/validate-national-catalog-preview.mjs"
      - ".github/workflows/national-catalog-crawl-preview.yml"

permissions:
  contents: read

concurrency:
  group: national-catalog-crawl-preview
  cancel-in-progress: true

jobs:
  validate-importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test national catalogue importer and merge mode
        run: node scripts/test-national-catalog-import.mjs

  crawl:
    needs: validate-importer
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CRAWL_CHUNK_INDEX: ${{ matrix.chunk }}
      CRAWL_CHUNKS: "3"
      CRAWL_CONCURRENCY: "2"
      CRAWL_REQUEST_DELAY_MS: "350"
      OUTPUT_CSV: data/incoming/national-monitoring-2025-part-${{ matrix.chunk }}.csv
      OUTPUT_REPORT: data/incoming/national-monitoring-2025-part-${{ matrix.chunk }}-report.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test official monitoring parser and type mapping
        run: node scripts/test-national-monitoring-parser.mjs
      - name: Crawl this regional chunk
        run: node scripts/crawl-national-monitoring.mjs
      - name: Upload regional crawl artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-monitoring-2025-crawl-part-${{ matrix.chunk }}
          path: |
            data/incoming/national-monitoring-2025-part-${{ matrix.chunk }}.csv
            data/incoming/national-monitoring-2025-part-${{ matrix.chunk }}-report.json
          if-no-files-found: warn
          retention-days: 7

  merge-preview:
    needs: [validate-importer, crawl]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download all regional crawl artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: national-monitoring-2025-crawl-part-*
          path: data/incoming/parts
          merge-multiple: true
      - name: Merge and validate all 89 regional pages
        run: node scripts/merge-national-monitoring-crawl.mjs
      - name: Build merged catalogue preview while preserving current records
        run: >
          node scripts/import-national-catalog.mjs
          --input data/incoming/national-monitoring-2025-combined.csv
          --source "Минпросвещения РФ — СПО-мониторинг 2025 + Минобрнауки РФ — мониторинг ВО 2025 (89 регионов)"
          --snapshot 2025
          --source-url "https://monitoring.miccedu.ru/?m=spo&year=2025"
          --preserve-existing-national true
          --output data/incoming/catalog-national-preview.js
      - name: Validate generated catalogue and report
        run: node scripts/validate-national-catalog-preview.mjs
      - name: Upload combined data and catalogue preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-monitoring-2025-catalogue-preview
          path: |
            data/incoming/national-monitoring-2025-combined.csv
            data/incoming/national-monitoring-2025-combined-report.json
            data/incoming/catalog-national-preview.js
            data/incoming/catalog-national-preview-report.json
          if-no-files-found: warn
          retention-days: 7
