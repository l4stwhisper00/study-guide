<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Подготовка к экзаменам | Навигатор</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

  <style>
    :root {
      --bg-base: #050508;
      --bg-surface: #0a0a10;
      --glass-bg: rgba(255, 255, 255, 0.02);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-hover: rgba(255, 255, 255, 0.04);
      --text-main: #ffffff;
      --text-muted: #8b92a5;
      --accent-primary: #00ff88;
      --radius-md: 12px;
      --radius-lg: 16px;
      --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; cursor: default; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a, button, input, label { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .ambient-bg {
      position: fixed; inset: 0; z-index: -2;
      background: radial-gradient(circle at 50% 0%, #151a2d 0%, var(--bg-base) 60%);
    }

    .nav {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      z-index: 100; width: min(1100px, calc(100% - 40px));
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; border-radius: 100px;
      background: rgba(5, 5, 8, 0.4);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .logo { display: flex; align-items: center; gap: 12px; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 18px; }
    .logo-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: var(--accent-primary); color: var(--bg-base); font-size: 20px; }
    
    .back-btn {
      display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--text-muted);
      transition: var(--transition); padding: 8px 16px; border-radius: 100px; border: 1px solid transparent;
    }
    .back-btn:hover { color: var(--text-main); background: var(--glass-hover); border-color: var(--glass-border); }

    main { flex: 1; padding: 140px 20px 80px; max-width: 1000px; margin: 0 auto; width: 100%; }
    
    .page-title { font-family: 'Manrope', sans-serif; font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; margin-bottom: 16px; }
    .page-sub { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 40px; max-width: 600px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 40px; flex-wrap: wrap; }
    .tab-btn {
      padding: 12px 24px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
      border-radius: var(--radius-md); color: var(--text-muted); font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 500; transition: var(--transition);
    }
    .tab-btn:hover { background: var(--glass-hover); color: var(--text-main); }
    .tab-btn.active { background: var(--accent-primary); color: var(--bg-base); border-color: var(--accent-primary); }

    .topics-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }
    
    .topic-item {
      display: flex; align-items: center; gap: 16px; padding: 20px 24px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: var(--radius-md); transition: var(--transition);
    }
    .topic-item:hover { background: var(--glass-hover); border-color: rgba(255,255,255,0.15); }

    .topic-item input[type="checkbox"] { display: none; }
    .checkmark {
      width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--text-muted);
      display: grid; place-items: center; transition: var(--transition); flex-shrink: 0;
    }
    .checkmark i { opacity: 0; transform: scale(0.5); transition: var(--transition); color: var(--bg-base); font-size: 16px; font-weight: bold; }
    
    .topic-item input:checked + .checkmark { background: var(--accent-primary); border-color: var(--accent-primary); }
    .topic-item input:checked + .checkmark i { opacity: 1; transform: scale(1); }
    .topic-item input:checked ~ .topic-text { color: var(--text-muted); text-decoration: line-through; }

    .topic-text { font-size: 16px; font-weight: 500; transition: var(--transition); }

    .resources-card {
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.05) 0%, var(--glass-bg) 100%);
      border: 1px solid rgba(0, 255, 136, 0.15);
      border-radius: var(--radius-lg); padding: 32px; margin-top: 40px;
    }
    .resources-card h3 { font-family: 'Manrope', sans-serif; font-size: 20px; margin-bottom: 16px; color: var(--accent-primary); display: flex; align-items: center; gap: 10px; }
    .resources-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .resource-link {
      display: flex; align-items: center; gap: 12px; padding: 16px;
      background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
      border-radius: var(--radius-md); transition: var(--transition);
    }
    .resource-link:hover { background: rgba(0,0,0,0.5); border-color: var(--accent-primary); transform: translateY(-2px); }
    .resource-link i { font-size: 24px; color: var(--text-main); }
    .resource-link div { display: flex; flex-direction: column; }
    .resource-link b { font-size: 15px; }
    .resource-link span { font-size: 13px; color: var(--text-muted); }

    @media (max-width: 768px) {
      .resources-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>

  <header class="nav">
    <a href="index.html" class="logo">
      <div class="logo-mark"><i class="ph-fill ph-compass"></i></div>
      Навигатор
    </a>
    <a href="index.html" class="back-btn">
      <i class="ph ph-arrow-left"></i> На главную
    </a>
  </header>

  <main>
    <h1 class="page-title">Подготовка к экзаменам</h1>
    <p class="page-sub">Отмечай изученные темы и переходи по ссылкам на официальные банки заданий. Твой прогресс сохраняется автоматически.</p>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchSubject('inf', this)">Информатика</button>
      <button class="tab-btn" onclick="switchSubject('math', this)">Математика</button>
      <button class="tab-btn" onclick="switchSubject('rus', this)">Русский язык</button>
      <button class="tab-btn" onclick="switchSubject('phys', this)">Физика</button>
      <button class="tab-btn" onclick="switchSubject('chem', this)">Химия</button>
      <button class="tab-btn" onclick="switchSubject('bio', this)">Биология</button>
      <button class="tab-btn" onclick="switchSubject('soc', this)">Обществознание</button>
      <button class="tab-btn" onclick="switchSubject('hist', this)">История</button>
      <button class="tab-btn" onclick="switchSubject('eng', this)">Английский</button>
    </div>

    <div class="topics-list" id="topicsContainer"></div>

    <div class="resources-card">
      <h3><i class="ph-fill ph-link"></i> Где готовиться?</h3>
      <div class="resources-grid">
        <a href="https://fipi.ru/ege/otkrytyy-bank-zadaniy-ege" target="_blank" class="resource-link">
          <i class="ph ph-bank"></i>
          <div><b>ФИПИ</b><span>Официальный банк заданий</span></div>
        </a>
        <a href="https://inf-ege.sdamgia.ru/" target="_blank" class="resource-link">
          <i class="ph ph-laptop"></i>
          <div><b>Решу ЕГЭ</b><span>Тренировочные варианты</span></div>
        </a>
      </div>
    </div>
  </main>

  <script>
    const subjectsData = {
      inf: { title: "Информатика", topics: [
        { id: "inf1", name: "Системы счисления и перевод чисел" },
        { id: "inf2", name: "Логика и таблицы истинности" },
        { id: "inf3", name: "Алгоритмы и блок-схемы" },
        { id: "inf4", name: "Программирование (циклы и массивы)" },
        { id: "inf5", name: "Теория игр (Задание 19-21)" }
      ]},
      math: { title: "Математика", topics: [
        { id: "math1", name: "Планиметрия (треугольники, окружности)" },
        { id: "math2", name: "Стереометрия (объемы и площади)" },
        { id: "math3", name: "Производная и исследование функций" },
        { id: "math4", name: "Текстовые задачи на движение и работу" },
        { id: "math5", name: "Экономические задачи (кредиты и вклады)" }
      ]},
      rus: { title: "Русский язык", topics: [
        { id: "rus1", name: "Орфография (приставки, корни, суффиксы)" },
        { id: "rus2", name: "Пунктуация в сложных предложениях" },
        { id: "rus3", name: "Грамматические и речевые нормы" },
        { id: "rus4", name: "Средства выразительности (тропы)" },
        { id: "rus5", name: "Написание сочинения (Задание 27)" }
      ]},
      phys: { title: "Физика", topics: [
        { id: "phys1", name: "Механика (кинематика, динамика)" },
        { id: "phys2", name: "Молекулярная физика и термодинамика" },
        { id: "phys3", name: "Электродинамика (цепи, магнитное поле)" },
        { id: "phys4", name: "Оптика (линзы, волны)" },
        { id: "phys5", name: "Квантовая физика и атомы" }
      ]},
      chem: { title: "Химия", topics: [
        { id: "chem1", name: "Строение атома и периодический закон" },
        { id: "chem2", name: "Химическая связь и строение вещества" },
        { id: "chem3", name: "Неорганическая химия (металлы, неметаллы)" },
        { id: "chem4", name: "Органическая химия (углеводороды)" },
        { id: "chem5", name: "Расчетные задачи по уравнениям реакций" }
      ]},
      bio: { title: "Биология", topics: [
        { id: "bio1", name: "Ботаника (анатомия растений)" },
        { id: "bio2", name: "Зоология (беспозвоночные и хордовые)" },
        { id: "bio3", name: "Анатомия человека" },
        { id: "bio4", name: "Генетика и селекция" },
        { id: "bio5", name: "Экология и эволюция" }
      ]},
      soc: { title: "Обществознание", topics: [
        { id: "soc1", name: "Человек и общество" },
        { id: "soc2", name: "Экономика (рынок, налоги, банки)" },
        { id: "soc3", name: "Социальные отношения" },
        { id: "soc4", name: "Политика (государство, власть)" },
        { id: "soc5", name: "Право (Конституция, отрасли права)" }
      ]},
      hist: { title: "История", topics: [
        { id: "hist1", name: "Древняя Русь и период раздробленности" },
        { id: "hist2", name: "Московское государство (XIV–XVII вв.)" },
        { id: "hist3", name: "Российская империя (XVIII–XIX вв.)" },
        { id: "hist4", name: "Революции и СССР (XX век)" },
        { id: "hist5", name: "Современная Россия и ВОВ" }
      ]},
      eng: { title: "Английский язык", topics: [
        { id: "eng1", name: "Времена глагола и пассивный залог" },
        { id: "eng2", name: "Словообразование и лексика" },
        { id: "eng3", name: "Чтение и понимание текстов" },
        { id: "eng4", name: "Аудирование" },
        { id: "eng5", name: "Письменная часть (Эссе)" }
      ]}
    };

    let currentSubject = 'inf';

    function getProgress(id) {
      const saved = localStorage.getItem(`exam_progress_${id}`);
      return saved ? JSON.parse(saved) : [];
    }

    function saveProgress(id, checkedIds) {
      localStorage.setItem(`exam_progress_${id}`, JSON.stringify(checkedIds));
    }

    function renderTopics() {
      const container = document.getElementById('topicsContainer');
      container.innerHTML = '';
      
      const subject = subjectsData[currentSubject];
      const checkedIds = getProgress(currentSubject);

      subject.topics.forEach(topic => {
        const isChecked = checkedIds.includes(topic.id);
        
        const label = document.createElement('label');
        label.className = 'topic-item';
        label.innerHTML = `
          <input type="checkbox" value="${topic.id}" ${isChecked ? 'checked' : ''} onchange="handleCheck(this)">
          <div class="checkmark"><i class="ph-bold ph-check"></i></div>
          <span class="topic-text">${topic.name}</span>
        `;
        container.appendChild(label);
      });
    }

    function handleCheck(checkbox) {
      let checkedIds = getProgress(currentSubject);
      
      if (checkbox.checked) {
        if (!checkedIds.includes(checkbox.value)) checkedIds.push(checkbox.value);
      } else {
        checkedIds = checkedIds.filter(id => id !== checkbox.value);
      }
      
      saveProgress(currentSubject, checkedIds);
    }

    function switchSubject(subjectKey, btn) {
      currentSubject = subjectKey;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTopics();
    }

    renderTopics();
  </script>
</body>
</html>
